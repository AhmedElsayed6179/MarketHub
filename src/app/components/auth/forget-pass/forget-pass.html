<div class="auth-page Image-Background">
  <div class="auth-overlay"></div>

  <div class="auth-card">

    <!-- Header -->
    <div class="auth-card-header">
      <div class="auth-logo">
        <img src="market.png" alt="MarketHub" />
      </div>
      <h2 class="auth-title">Reset Password</h2>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
    </div>

    <!-- Form -->
    <form [formGroup]="ResetPassword" (submit)="submitResetPass()" class="auth-form">

      <div class="auth-field">
        <label for="email">Your Email Address</label>
        <div class="field-wrap">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" formControlName="email" placeholder="you@example.com" class="auth-input" name="email"
            id="email" />
        </div>
        @if (email?.touched && email?.invalid) {
        <span class="auth-error">
          @if (email?.errors?.['required']) { Email Address is Required }
          @if (email?.errors?.['email'] && email?.value) { Invalid Email Address }
        </span>
        }
      </div>

      <button type="submit" [disabled]="ResetPassword.invalid" class="auth-btn">
        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
      </button>

    </form>

    <div class="auth-card-footer">
      <a routerLink="/Login" class="auth-back">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>
    </div>

  </div>
</div>
